[project]
name = "modwright-mcp"
version = "0.1.0"
description = "MCP server for the C# game mod development lifecycle: scaffold, validate, build, deploy, and observe mods."
requires-python = ">=3.11"
dependencies = [
    # Provides both halves we need: the server (mcp.server.MCPServer) and the
    # client used to call DecompilerServer (mcp.Client). The 2.0 SDK renamed
    # FastMCP to MCPServer, so the floor is 2.0 rather than 1.x.
    "mcp>=2.0.0",
    # Parses the MOD's own source to extract patch targets. Never used on game
    # assemblies -- that is DecompilerServer's job.
    "tree-sitter>=0.21",
    "tree-sitter-c-sharp>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
modwright-mcp = "modwright.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "game: needs a real supported game installed locally (see conftest)",
    "decompiler: needs a DecompilerServer build (MODWRIGHT_DECOMPILER_PATH)",
    "dotnet: needs the .NET SDK on PATH",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
